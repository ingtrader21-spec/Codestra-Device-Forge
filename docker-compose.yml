services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: python -m http.server 8080
    ports:
      - "127.0.0.1:8080:8080"

# Third-party integrations are intentionally not exposed publicly.
