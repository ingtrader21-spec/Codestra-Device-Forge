services:
  api:
    build: .
    container_name: codestra-device-forge
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      MDMESH_URL: http://127.0.0.1:18080
      MOBSF_URL: http://127.0.0.1:18000
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: codestra-mobsf
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
