services:
  api:
    build: .
    container_name: codestra-device-forge
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      MDMESH_URL: http://mdmesh:8080
      MOBSF_URL: http://mobsf:8000
    networks: [forge]
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: codestra-mobsf
    restart: unless-stopped
    expose: ["8000"]
    networks: [forge]
networks:
  forge:
    driver: bridge
